<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BaianoXP</title>
<link rel="icon" type="image/png" href="coisas/icons.png">
<link rel="stylesheet" href="style.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
</head>

<body>

<video autoplay muted loop id="bgVideo">
    <source src="coisas/Video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div id="tsparticles"></div>

<div class="volume-box">

    <i id="volumeIcon" class="fa-solid fa-volume-high"></i>

    <input
        type="range"
        id="volumeSlider"
        min="0"
        max="100"
        value="50">

</div>

<audio id="music" autoplay loop>
    <source src="coisas/musica.mp3" type="audio/mpeg">
</audio>

<div class="container">

    <img src="coisas/perfil.jpg" class="avatar">

    <div class="nome">BaianoXP</div>

    <div class="bio">
        A melhor maneira de prever o futuro é criá-lo.
    </div>

    <div class="local">
        <i class="fa-solid fa-location-dot"></i>
        Brasil - salvador
    </div>

    <div class="card">

        <img src="coisas/perfil.jpg">

        <div class="card-info">
            <h3>BaianoXP</h3>
            <p>XP</p>
        </div>
     
    </div>

    <div class="social">

        <a href="https://open.spotify.com/user/31dgaa7uuxaxphgbbcpl4tbftita?si=3544a2f557004c67" target="_blank"><i class="fab fa-spotify"></i></a>

        <a href="https://steamcommunity.com/profiles/76561199486207636/" target="_blank" ><i class="fab fa-steam"></i></a>

        <a href="https://www.instagram.com/bruno_menezes11/"target="_blank" ><i class="fab fa-instagram"></i></a>

        <a href="https://discord.gg/HpT2wggwRD" target="_blank"><i class="fab fa-discord"></i></a>

    </div>

    <div class="views">
        👁 7
    </div>
<script>
 const texto = "BaianoXP";
 let i = texto.length;
 let voltando = false;

 setInterval(() => {
    document.title = "@" + texto.substring(0, i);

    if (!voltando) {
        i--;
        if (i < 0) {
            voltando = true;
            i = 1;
        }
    } else {
        i++;
        if (i > texto.length) {
            voltando = false;
            i = texto.length - 1;
        }
    }
 }, 500);
</script>
    
</div>

<script>

const music = document.getElementById("music");

window.addEventListener("click",()=>{
    music.muted=false;
    music.play();
},{once:true});

function toggleMusic(){
    if(music.paused){
        music.play();
    }else{
        music.pause();
    }
}

tsParticles.load("tsparticles",{
    particles:{
        number:{value:80},
        color:{value:"#ffffff"},
        opacity:{value:0.4},
        size:{value:2},
        move:{
            enable:true,
            speed:1
        },
        links:{
            enable:true,
            color:"#ffffff",
            opacity:0.15
        }
    }
});

</script>
<script src="script.js"></script>
</body>
</html>
